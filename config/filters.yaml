# 过滤口径正本(用户 2026-10-17 钦定):
#   范围 = 大成都;银行全收;国企按「金融/后勤」关键词筛;政府事业单位整体收;其它一律不要。
# 修改这里即可调口径,代码(agents/extractor.py 的 qualify)不改。
region:
  name: 大成都
  include:            # 命中任一即视为成都范围(标题/单位名)
    - 成都
    - 天府新区
    - 高新区
    - 东部新区
    - 锦江
    - 青羊
    - 金牛
    - 武侯
    - 成华
    - 龙泉驿
    - 青白江
    - 新都
    - 温江
    - 双流
    - 郫都
    - 新津
    - 都江堰
    - 彭州
    - 邛崃
    - 崇州
    - 简阳
    - 金堂
    - 大邑
    - 蒲江
  exclude:            # 命中任一且无成都关键词 => 判为非成都
    - 乐山
    - 宜宾
    - 绵阳
    - 德阳
    - 泸州
    - 自贡
    - 内江
    - 南充
    - 达州
    - 广安
    - 遂宁
    - 眉山
    - 资阳
    - 巴中
    - 雅安
    - 广元
    - 攀枝花
    - 凉山
    - 阿坝
    - 甘孜
    - 重庆
    - 北京
    - 上海
    - 广州
    - 深圳
    - 西安
    - 昆明
    - 贵阳

# 非「岗位招聘」的过程/结果类公告一律排除(拟聘公示、成绩、体检、面试…)
exclude_title:
  - 拟聘
  - 拟录用
  - 录用名单
  - 公示
  - 成绩
  - 体检
  - 考察
  - 面试
  - 报到
  - 递补
  - 资格复审

domain:               # 仅对 entity=soe(国企) 生效
  finance:            # 金融类
    - 金融
    - 财务
    - 会计
    - 出纳
    - 融资
    - 投资
    - 审计
    - 风控
    - 风险
    - 信贷
    - 授信
    - 银行
    - 保险
    - 证券
    - 基金
    - 担保
    - 理财
    - 资产管理
  logistics:          # 后勤类
    - 后勤
    - 行政
    - 综合管理
    - 办公室
    - 采购
    - 招采
    - 物资
    - 保障
    - 总务
    - 档案

# 各主体类型的过滤规则:domain_required=是否必须命中金融/后勤关键词
rules:
  bank:        {domain_required: false}   # 银行:全收(岗位天然属金融)
  soe:         {domain_required: true}    # 国企:须命中金融/后勤
  gov:         {domain_required: false}   # 政府:整体收
  institution: {domain_required: false}   # 事业单位:整体收
