# 数据源正本:大成都「金融/后勤 + 国企/政府事业单位/银行」招聘官方列表页
# 口径见 config/filters.yaml(范围=大成都;银行全收;国企按金融后勤筛;事业单位整体收)。
# 只收公开、低对抗的官方渠道;不碰需登录/验证码/强风控的招聘平台。
# 字段:
#   id             源唯一标识(快照/正本文件名)
#   name           人读名称
#   urls           列表页地址(可多个分页,采集器依次抓)
#   type           official_page | official_api
#   parser         抽取器名(agents/extractor.py 注册表)
#   entity         bank | soe | gov | institution (决定过滤规则)
#   region         展示用地区
#   default_region 若为「成都」则该源条目默认视为成都范围(免关键词匹配)
#   title_kw       标题命中关键词(判定为一条招聘公告)
#   check          采集频率(人工参考)
sources:
# ── 银行(成都范围内全收) ──────────────────────────────
- id: cd_bocd
  name: 成都银行-招聘公告
  urls:
    - https://www.bocd.com.cn/zyxxfb/rczp/zhaopingonggao/list1.html
    - https://www.bocd.com.cn/zyxxfb/rczp/zhaopingonggao/list2.html
  type: official_page
  parser: anchors_list
  entity: bank
  region: 成都
  default_region: 成都
  title_kw: [招聘, 选聘]
  check: daily

# ── 国企(成都,须命中金融/后勤关键词) ──────────────────
- id: sc_gzw_recruit
  name: 四川省国资委-国企招聘
  urls:
    - http://gzw.sc.gov.cn/scsgzw/CU230408/cu_list.shtml
  type: official_page
  parser: anchors_list
  entity: soe
  region: 成都
  # 省属国企总部多在成都;标题常不标城市 -> 默认按成都范围,再按金融/后勤筛(用户口径)
  default_region: 成都
  title_kw: [招聘, 招录, 选聘, 遴选]
  check: daily

# ── 政府/事业单位(大成都整体收) ──────────────────────
- id: cdpta_sydw
  name: 成都人事考试网-事业单位/公招
  urls:
    - https://cdpta.cdrsigc.com/netpage/index.do
  type: official_page
  parser: anchors_list
  entity: institution
  region: 成都
  default_region: 成都
  title_kw: [招聘, 公招, 选聘, 选调, 招录, 遴选, 聘用]
  check: daily

# 备注:四川省人社厅(sc_rst)/四川人事考试网(scpta)首页为 JS/GBK,静态列表拿不到招聘公告,
#       暂用成都市人事考试网(cdpta_sydw)覆盖事业单位/公招;省属事业单位源待接入(阶段2)。
