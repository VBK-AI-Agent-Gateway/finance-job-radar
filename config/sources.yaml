# 数据源正本:大成都「金融/后勤 + 国企/政府事业单位/银行」招聘官方列表页
# 口径见 config/filters.yaml(范围=大成都;银行全收;国企按金融后勤筛;事业单位整体收)。
# 只收公开、低对抗的官方渠道;不碰需登录/验证码/强风控的招聘平台。
# 字段:
#   id             源唯一标识(快照/正本文件名)
#   name           人读名称
#   urls           列表页地址(可多个分页,采集器依次抓)
#   type           official_page | official_api
#   parser         抽取器名(agents/extractor.py 注册表:anchors_list|gov_list|link_directory|json_api)
#   entity         bank | soe | gov | institution (决定过滤规则)
#   region         展示用地区
#   default_region 若为「成都」则该源条目默认视为成都范围(免关键词匹配)
#   region_kw      源级覆盖 region.include(全国性源只看川/蓉,如中国银行)
#   title_kw       标题命中关键词(判定为一条招聘公告)
#   method/body/page_param/pages/json_path/detail_tmpl  official_api(json_api)专用
#   check          采集频率(人工参考)
sources:
# ── 银行(成都范围内全收) ──────────────────────────────
- id: cd_bocd
  name: 成都银行-招聘公告
  urls:
    - https://www.bocd.com.cn/zyxxfb/rczp/zhaopingonggao/list1.html
    - https://www.bocd.com.cn/zyxxfb/rczp/zhaopingonggao/list2.html
  type: official_page
  parser: anchors_list
  entity: bank
  region: 成都
  default_region: 成都
  title_kw: [招聘, 选聘]
  check: daily

- id: cd_cdrcb
  name: 成都农商银行-员工招聘
  url: https://www.cdrcb.com/pin/dt.php      # 站点为 JS 渲染,走后端 JSON 接口
  type: official_api
  parser: json_api
  method: POST
  body: {tp: 0, hj: 0, num: 20}              # hj=0 -> 招聘公告(1=资格审核 2=笔试成绩 3=面试成绩 4=拟聘名单)
  page_param: page
  pages: 3
  json_path: zp
  detail_tmpl: https://www.cdrcb.com/pin/zpdetail.htm?id={id}
  entity: bank
  region: 成都
  default_region: 成都
  title_kw: [招聘, 选聘]
  check: daily

- id: cd_boc
  name: 中国银行-招聘公告(全国,只看四川/成都)
  urls:
    - https://www.boc.cn/aboutboc/bi4/
    - https://www.boc.cn/aboutboc/bi4/index_1.html
    - https://www.boc.cn/aboutboc/bi4/index_2.html
  type: official_page
  parser: anchors_list
  entity: bank
  region: 成都
  region_kw: [成都, 四川]                    # 全国性公告仅在标题含川/蓉分行时纳入
  title_kw: [招聘]
  check: daily

# ── 国企(成都,须命中金融/后勤关键词) ──────────────────
- id: sc_gzw_recruit
  name: 四川省国资委-国企招聘
  urls:
    - http://gzw.sc.gov.cn/scsgzw/CU230408/cu_list.shtml
  type: official_page
  parser: anchors_list
  entity: soe
  region: 成都
  # 省属国企总部多在成都;标题常不标城市 -> 默认按成都范围,再按金融/后勤筛(用户口径)
  default_region: 成都
  title_kw: [招聘, 招录, 选聘, 遴选]
  check: daily

# ── 政府/事业单位(大成都整体收) ──────────────────────
- id: cdpta_sydw
  name: 成都人事考试网-事业单位/公招
  urls:
    - https://cdpta.cdrsigc.com/netpage/index.do
  type: official_page
  parser: anchors_list
  entity: institution
  region: 成都
  default_region: 成都
  title_kw: [招聘, 公招, 选聘, 选调, 招录, 遴选, 聘用]
  check: daily

# 备注:四川省人社厅(sc_rst)/四川人事考试网(scpta)首页为 JS/GBK,静态列表拿不到招聘公告,
#       暂用成都市人事考试网(cdpta_sydw)覆盖事业单位/公招;省属事业单位源待接入(阶段2)。
